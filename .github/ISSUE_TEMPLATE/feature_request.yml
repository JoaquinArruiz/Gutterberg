name: Feature request
description: Something you would like the app to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English is preferred, but you are welcome to write in Spanish too (español también vale).
  - type: textarea
    id: want
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What this would let you do, or what is hard today.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Is there a way around it now?
    validations:
      required: false
