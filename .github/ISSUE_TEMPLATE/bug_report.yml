name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. English is preferred, but you are welcome to write in Spanish too (español también vale).
        In the app, **Preferences › Help › Copy app info** gives you the version and system to paste below, and **Copy log** gives you the log.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the app, e.g. 1.0.0 (Preferences › About).
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Which system you use.
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step, so someone else can make it happen again. If you cannot share your PDF, say whether `examples/09-bad-scan.pdf` (a crooked, mixed-size scan) does the same.
      placeholder: |
        1. Open a PDF…
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you thought would happen instead.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Did you find a way around it?
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Optional, but it helps a lot if the app closed by itself, showed an error or did not start. In the app, press **Preferences › Help › Copy log** and paste it here. If the app does not open, paste the end of the file `gutterberg.log` (the last 100 lines or so) from this folder:
        - macOS: `~/Library/Logs/Gutterberg`
        - Windows: `%LOCALAPPDATA%\Gutterberg\logs`
        - Linux: `~/.local/share/Gutterberg/logs`

        Versions after 0.10.0 keep a log. It is plain text and has none of your PDFs; look it over before you send it, because an error can mention a file or folder name.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send it
      options:
        - label: I searched the open issues and this is not one of them
          required: true
