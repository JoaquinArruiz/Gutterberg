name: Release

# Pushing a tag such as v1.1.0 builds the app for every platform and leaves a draft GitHub release with the
# installers, their updater signatures, latest.json and the notes from CHANGELOG.md. Publishing the draft by hand
# is what makes installed apps see the update. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the versions and the changelog
        id: notes
        shell: bash
        run: |
          scripts/check-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
          {
            echo 'body<<NOTES_EOF'
            cat "$RUNNER_TEMP/notes.md"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Fetch pdfium for this platform
        shell: bash
        run: scripts/fetch-pdfium.sh ${{ matrix.pdfium }}

      # The notices of the Rust crates, the npm packages and pdfium. The file is built into the app (Preferences ›
      # About shows it) and bundled with every installer, so it has to exist before the build.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Collect the third-party licenses
        shell: bash
        run: node scripts/third-party-licenses.mjs

      # The command line (crates/card-cli) goes into every installer next to the app (Tauri's externalBin, added by
      # tauri.cli.conf.json, wants it named for the target), and is attached to the release on its own as well.
      - name: Build the command line
        shell: bash
        run: |
          cargo build --release -p card-cli --target ${{ matrix.target }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/gutterberg-cli$ext" "src-tauri/binaries/gutterberg-cli-${{ matrix.target }}$ext"
          echo "CLI_ASSET=src-tauri/binaries/gutterberg-cli-${{ matrix.target }}$ext" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Gutterberg v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.cli.conf.json

      - name: Attach the command line to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        # By the release's id: the release is still a draft, which a lookup by tag does not find.
        run: |
          gh api -X POST -H "Content-Type: application/octet-stream" --input "$CLI_ASSET" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$CLI_ASSET")"

      # The Microsoft Store package, from the app just built: the same exe, which turns its updater off when it runs
      # from the package, since the Store updates it. It is unsigned (the Store signs it), so it is kept with the run
      # for me to upload in Partner Center rather than offered on the release (see "Microsoft Store" in
      # docs/releasing.md). A pre-release has no Store version and is skipped. A failure here does not fail the
      # release, whose files are already on the draft: the run then has no microsoft-store artifact.
      - name: Pack the Microsoft Store package
        if: matrix.platform == 'windows-latest' && !contains(github.ref_name, '-')
        continue-on-error: true
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "MSIX=Gutterberg_${version}_x64.msix" >> "$GITHUB_ENV"
          node scripts/make-msix.mjs --exe target/release/gutterberg.exe --cli "$CLI_ASSET" --out "Gutterberg_${version}_x64.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'windows-latest' && !contains(github.ref_name, '-')
        continue-on-error: true
        with:
          name: microsoft-store
          path: ${{ env.MSIX }}
          if-no-files-found: error
