name: CLA

# Asks the author of every outside pull request to sign CLA.md once, by posting a comment, and records who signed in
# signatures/cla.json on the cla-signatures branch. A pull request cannot pass until its author has signed.
# pull_request_target runs this file as it is on main and checks out nothing, so a pull request cannot change it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Dependabot's pull requests are skipped: the action takes a commit's committer when its author is not a user,
    # which for Dependabot is GitHub's web-flow, not in the allowlist. I apply its updates myself anyway.
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/JoaquinArruiz/Gutterberg/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: JoaquinArruiz,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before I can merge it, please read the
            [contributor license agreement](https://github.com/JoaquinArruiz/Gutterberg/blob/main/CLA.md) and sign it
            by posting the comment below. You only do this once; it covers all your contributions.
          custom-allsigned-prcomment: Everyone in this pull request has signed the contributor license agreement.
          signed-commit-message: "$contributorName signed the contributor license agreement in #$pullRequestNo"
          create-file-commit-message: Start the record of contributor license agreement signatures
