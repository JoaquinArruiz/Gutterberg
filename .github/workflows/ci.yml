name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: scripts/fetch-pdfium.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
        env:
          PDFIUM_LIB_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium
      - name: Validate exported fixtures with qpdf
        run: |
          sudo apt-get install -y qpdf
          # The fixtures test leaves its exported PDFs in the temp dir.
          ls /tmp/card-core-fixtures-*/*-out.pdf
          for f in /tmp/card-core-fixtures-*/*-out.pdf; do qpdf --check "$f"; done
