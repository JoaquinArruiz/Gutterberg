name: CI

# Branches are checked by their pull request; a push builds only the branches a pull request merges into, and tags.
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: No AI tool as author or co-author
        run: scripts/check-authorship.sh "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - run: scripts/fetch-pdfium.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
        env:
          PDFIUM_LIB_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium
      - name: Validate exported fixtures with qpdf
        run: |
          sudo apt-get install -y qpdf
          # The fixtures test leaves its exported PDFs in the temp dir.
          ls /tmp/card-core-fixtures-*/*-out.pdf
          for f in /tmp/card-core-fixtures-*/*-out.pdf; do qpdf --check "$f"; done
