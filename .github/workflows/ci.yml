name: CI

# Branches are checked by their pull request; a push builds only the branches a pull request merges into, and tags.
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No AI tool as author or co-author
        run: scripts/check-authorship.sh "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - run: scripts/fetch-pdfium.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
        env:
          PDFIUM_LIB_PATH: ${{ github.workspace }}/src-tauri/resources/pdfium
      - name: Validate exported fixtures with qpdf
        run: |
          sudo apt-get install -y qpdf
          # The fixtures test leaves its exported PDFs in the temp dir.
          ls /tmp/card-core-fixtures-*/*-out.pdf
          for f in /tmp/card-core-fixtures-*/*-out.pdf; do qpdf --check "$f"; done
