[workspace]
resolver = "2"
members = ["crates/card-core", "crates/card-ai", "crates/card-cli", "src-tauri"]

# Dev builds compile dependencies (image/png, flate2, lopdf...) with optimizations;
# otherwise PNG encoding of previews is ~10x slower under `tauri dev`.
[profile.dev.package."*"]
opt-level = 3

# Release builds: one codegen unit and full LTO make a smaller, faster binary; strip drops the debug symbols that
# nobody ships. It slows the release build, not `tauri dev`.
[profile.release]
codegen-units = 1
lto = true
strip = true
