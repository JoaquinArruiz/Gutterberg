[package]
name = "card-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Geometry, layout and PDF export engine for Gutterberg (no UI/Tauri dependencies)"

[dependencies]
lopdf = "0.45"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
pdfium-render = "0.9"
# JPEG too: an image model may answer Fill with AI with one.
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
serde_json = "1"
sha2 = "0.10"
# CMYK export: Little CMS built into the app (never the system's), and a JPEG encoder that writes CMYK.
lcms2 = { version = "6.2", features = ["static"] }
jpeg-encoder = "0.7"


[dev-dependencies]
# The tests make their own tiny images, so they also need the JPEG encoder.
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
