[package]
name = "gutterberg"
version = "0.10.0"
edition = "2021"
publish = false
description = "Gutterberg turns print-and-play PDFs and card scans into cut-ready sheets: exact card sizes, clean gutters, and the original artwork untouched."

[lib]
name = "gutterberg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
card-core = { path = "../crates/card-core" }
card-ai = { path = "../crates/card-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-os = "2.4.0"
tauri-plugin-process = "2"
tauri-plugin-prevent-default = "6"

# API keys live in the system keychain, written and read only here in Rust.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Where the old data folders were, for the one-time move to their new names (see src/data_dirs.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
dirs = "7"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
