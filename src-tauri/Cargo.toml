[package]
name = "pdf-card-editor"
version = "0.1.0"
edition = "2021"
description = "Print-and-Play PDF card spacing editor"

[lib]
name = "pdf_card_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
card-core = { path = "../crates/card-core" }
serde = { version = "1", features = ["derive"] }
pdfium-render = "0.9"
