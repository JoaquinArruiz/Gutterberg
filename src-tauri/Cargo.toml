[package]
name = "gutterberg"
version = "0.1.0"
edition = "2021"
description = "Gutterberg turns print-and-play PDFs and card scans into cut-ready sheets: exact card sizes, clean gutters, and the original artwork untouched."

[lib]
name = "gutterberg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
card-core = { path = "../crates/card-core" }
card-ai = { path = "../crates/card-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-os = "2.4.0"

# API keys live in the system keychain, written and read only here in Rust.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
